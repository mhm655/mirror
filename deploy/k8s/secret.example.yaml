# Example only -- do not commit a real secret.
#
# Format matches MIRROR_API_KEYS: comma-separated "name:role:secret" entries.
# Generate real secrets with e.g. `openssl rand -hex 24` and store this via
# your cluster's secret manager (sealed-secrets, External Secrets, etc.),
# never as plain YAML in version control.
apiVersion: v1
kind: Secret
metadata:
  name: mirror-api-keys
type: Opaque
stringData:
  keys: "ops-console:operator:CHANGE-ME,admin-cli:admin:CHANGE-ME-TOO"
